# =============================================================================
# vuln-agent · Compose Base (서비스 정의)
# =============================================================================
# 모든 환경 공통의 서비스 골격. 단독 실행용이 아니라
# compose.common.yml + compose.{dev,prod}.yml 과 겹쳐서 사용한다.
#   실행:  ./compose_runner.sh dev up -d   /   ./compose_runner.sh prod up -d
#
# [비밀값] 비밀번호·토큰은 env 가 아니라 Docker Secrets(txt 파일)로 주입한다.
#   secrets/mysql_root_password.txt / mysql_password.txt / ingest_token.txt
#   → 컨테이너 안 /run/secrets/* 로 마운트되고, *_FILE 환경변수로 참조.
#   실제 txt 는 git 에 커밋하지 않는다(.gitignore). `compose_runner.sh init` 이 생성.
# =============================================================================

services:
  # --- MySQL: 수집 데이터 저장소 -------------------------------------------
  db:
    image: mysql:${MYSQL_VERSION:-8.0}
    environment:
      # 비밀번호는 파일로(_FILE). 이름·DB명은 민감하지 않아 env 유지.
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      TZ: Asia/Seoul
    secrets:
      - mysql_root_password
      - mysql_password
    volumes:
      - db_data:/var/lib/mysql
      # 최초 기동 시 스키마 자동 적용
      - ./db:/docker-entrypoint-initdb.d:ro
      # my.cnf(charset/timezone/보안 튜닝)는 운영 전용으로 compose.prod.yml 에서 마운트.
      # (Windows dev 바인드 마운트는 world-writable → MySQL 이 무시하므로 dev 는 기본값 사용)
    healthcheck:
      # 루트 비번을 시크릿 파일에서 읽어 ping (env 에 비번을 두지 않기 위함)
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$(cat /run/secrets/mysql_root_password)\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - vulnagent

  # --- PHP(Apache): 수신 API + 현황/대시보드 -------------------------------
  web:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      # 앱 DB 비번 · 수신 토큰 · 최초 admin 비번도 시크릿 파일로 주입
      DB_PASS_FILE: /run/secrets/mysql_password
      INGEST_TOKEN_FILE: /run/secrets/ingest_token
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      TZ: Asia/Seoul
    secrets:
      - mysql_password
      - ingest_token
      - admin_password
    networks:
      - vulnagent

# --- Docker Secrets: 비밀값을 txt 파일에서 로드 -----------------------------
secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
  mysql_password:
    file: ./secrets/mysql_password.txt
  ingest_token:
    file: ./secrets/ingest_token.txt
  admin_password:
    file: ./secrets/admin_password.txt

networks:
  vulnagent:

volumes:
  db_data:
