# =============================================================================
# vuln-agent · Compose Base (서비스 정의)
# =============================================================================
# compose.common.yml + compose.{dev,prod}.yml 과 겹쳐서 사용.
#   실행:  ./compose_runner.sh dev up -d   /   ./compose_runner.sh prod up -d
#
# [비밀값] 비밀번호·토큰은 Docker Secrets(txt) 로 주입 (secrets/*.txt, gitignore).
# [서비스] db(MySQL) · web(PHP/Apache) · scheduler(피드 수집 주기 실행)
# =============================================================================

# 앱 컨테이너(web·scheduler) 공통 환경/시크릿 — 앵커로 재사용
x-app-env: &app-env
  DB_HOST: db
  DB_NAME: ${MYSQL_DATABASE}
  DB_USER: ${MYSQL_USER}
  DB_PASS_FILE: /run/secrets/mysql_password
  INGEST_TOKEN_FILE: /run/secrets/ingest_token
  ADMIN_PASSWORD_FILE: /run/secrets/admin_password
  TZ: Asia/Seoul

x-app-secrets: &app-secrets
  # mode 0444: 호스트 파일은 0600 유지, 컨테이너 안에서만 읽기 허용
  # (Apache 는 www-data 로 돌아 root 소유 0600 시크릿을 못 읽던 문제 해결)
  - source: mysql_password
    mode: 0444
  - source: ingest_token
    mode: 0444
  - source: admin_password
    mode: 0444

services:
  # --- MySQL: 수집 데이터 저장소 -------------------------------------------
  db:
    image: mysql:${MYSQL_VERSION:-8.0}
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      TZ: Asia/Seoul
    secrets:
      - mysql_root_password
      - mysql_password
    volumes:
      - db_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
      # my.cnf 는 운영 전용(compose.prod.yml) — Windows dev 는 기본값 사용
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$(cat /run/secrets/mysql_root_password)\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - vulnagent

  # --- PHP(Apache): 수신 API + 대시보드 ------------------------------------
  web:
    build: ./server
    image: vulnagent-app:latest
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env
    secrets: *app-secrets
    networks:
      - vulnagent

  # --- 스케줄러: 예약된 피드 커넥터를 주기 실행(사이드카) -------------------
  scheduler:
    build: ./server
    image: vulnagent-app:latest
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env
    secrets: *app-secrets
    command: ["sh", "-c", "while true; do php /var/www/html/bin/scheduler.php || true; sleep 60; done"]
    networks:
      - vulnagent

# --- Docker Secrets: 비밀값을 txt 파일에서 로드 -----------------------------
secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
  mysql_password:
    file: ./secrets/mysql_password.txt
  ingest_token:
    file: ./secrets/ingest_token.txt
  admin_password:
    file: ./secrets/admin_password.txt

networks:
  vulnagent:

volumes:
  db_data:
