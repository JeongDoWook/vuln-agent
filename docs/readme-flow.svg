<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060" role="img" aria-labelledby="title desc">
  <title id="title">vuln-agent 취약점 수집과 판단 흐름</title>
  <desc id="desc">에이전트가 있는 서버와 에이전트가 없는 IP 양쪽에서 사실을 모으고, 실행 맥락을 연결한 뒤 벤더 근거와 SBOM·컴플라이언스 기준을 교차 검증해 우선순위와 조치를 제시하는 네 단계를 2행 2열로 보여주는 흐름도</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#315ce8"/>
      <stop offset="1" stop-color="#7656e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#253b75" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7180a7"/>
    </marker>
    <style>
      text { font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", sans-serif; }
      .card-title { font-size: 26px; font-weight: 700; fill: #17223b; }
      .step { font-size: 16px; font-weight: 800; letter-spacing: 1.5px; }
      .body { font-size: 17px; fill: #4b5874; }
      .chip { font-size: 16px; font-weight: 650; fill: #31405f; }
      .lbl { font-size: 14px; font-weight: 700; fill: #8b96ad; letter-spacing: 0.6px; }
      .foot { font-size: 15px; fill: #7a869f; }
    </style>
  </defs>

  <rect width="1000" height="1060" rx="34" fill="url(#background)"/>

  <!-- Hero -->
  <rect x="36" y="28" width="928" height="124" rx="24" fill="url(#hero)"/>
  <circle cx="84" cy="90" r="25" fill="#ffffff" fill-opacity="0.18"/>
  <path d="M73 90l8 8 16-20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="128" y="76" font-size="27" font-weight="800" fill="#fff">설치 여부를 넘어, 실제 위험과 조치까지 연결합니다</text>
  <text x="128" y="106" font-size="16" fill="#eaf0ff">Bash 에이전트 → outbound HTTPS → 중앙 분석·웹 콘솔</text>
  <text x="128" y="130" font-size="16" fill="#eaf0ff">에이전트가 없는 IP 는 중앙이 관리 대역을 훑어 찾습니다</text>

  <!-- Step 1 : 수집 -->
  <g filter="url(#shadow)"><rect x="36" y="184" width="440" height="390" rx="24" fill="#fff" stroke="#dce5f7"/></g>
  <rect x="62" y="208" width="88" height="32" rx="16" fill="#e9efff"/>
  <text x="106" y="230" text-anchor="middle" class="step" fill="#315ce8">01 수집</text>
  <circle cx="434" cy="224" r="24" fill="#eff4ff"/>
  <path d="M422 224h24M426 216h16M430 208h8M426 232h16" stroke="#4169df" stroke-width="3" stroke-linecap="round"/>
  <text x="62" y="280" class="card-title">서버의 사실을 수집</text>
  <text x="62" y="310" class="body">깔린 것만 읽지 않습니다.</text>

  <text x="62" y="350" class="lbl">에이전트가 있는 서버</text>
  <rect x="62" y="360" width="388" height="36" rx="12" fill="#f3f6fc"/>
  <text x="256" y="384" text-anchor="middle" class="chip">패키지 · 버전 · 컨테이너 · 프로세스</text>
  <rect x="62" y="404" width="388" height="36" rx="12" fill="#f3f6fc"/>
  <text x="256" y="428" text-anchor="middle" class="chip">열린 포트 · 방화벽 · 계정</text>

  <text x="62" y="470" class="lbl">에이전트가 없는 IP — 자산 탐색</text>
  <rect x="62" y="480" width="388" height="36" rx="12" fill="#eef4ff" stroke="#cfdcfa"/>
  <text x="256" y="504" text-anchor="middle" class="chip" fill="#2e4c9c">관리 대역 TCP 스윕 · 역DNS 배너</text>

  <text x="62" y="546" class="foot">읽기 전용 · 아웃바운드 HTTPS 전송</text>

  <path d="M484 379H514" stroke="#7180a7" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 2 : 연결 -->
  <g filter="url(#shadow)"><rect x="524" y="184" width="440" height="390" rx="24" fill="#fff" stroke="#dce5f7"/></g>
  <rect x="550" y="208" width="88" height="32" rx="16" fill="#e8f7f2"/>
  <text x="594" y="230" text-anchor="middle" class="step" fill="#188866">02 연결</text>
  <circle cx="922" cy="224" r="24" fill="#eaf8f3"/>
  <circle cx="912" cy="218" r="5" fill="#239b78"/><circle cx="932" cy="218" r="5" fill="#239b78"/><circle cx="922" cy="234" r="5" fill="#239b78"/>
  <path d="M916 221l4 9M928 221l-4 9M917 218h10" stroke="#239b78" stroke-width="2.5"/>
  <text x="550" y="280" class="card-title">실행 맥락을 연결</text>
  <text x="550" y="310" class="body">실제로 닿는 위험인지 봅니다.</text>

  <text x="550" y="350" class="lbl">무엇이 무엇을 쓰는가</text>
  <rect x="550" y="360" width="388" height="36" rx="12" fill="#edf9f5"/>
  <text x="744" y="384" text-anchor="middle" class="chip" fill="#247b65">취약 패키지 → 사용 프로세스</text>
  <rect x="550" y="404" width="388" height="36" rx="12" fill="#edf9f5"/>
  <text x="744" y="428" text-anchor="middle" class="chip" fill="#247b65">열린 포트 · 망 세그먼트 → 도달 여부</text>

  <text x="550" y="470" class="lbl">결과</text>
  <rect x="550" y="480" width="388" height="36" rx="12" fill="#f3f6fc"/>
  <text x="744" y="504" text-anchor="middle" class="chip">미실행 · 내부 · 외부 등 노출 7단계</text>

  <text x="550" y="546" class="foot">노출 상태가 위험 등급을 바꿉니다</text>

  <path d="M744 578V602H256V624" fill="none" stroke="#7180a7" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 3 : 검증 -->
  <g filter="url(#shadow)"><rect x="36" y="630" width="440" height="390" rx="24" fill="#fff" stroke="#dce5f7"/></g>
  <rect x="62" y="654" width="88" height="32" rx="16" fill="#fff4df"/>
  <text x="106" y="676" text-anchor="middle" class="step" fill="#a66a00">03 검증</text>
  <circle cx="434" cy="670" r="24" fill="#fff6e5"/>
  <path d="M424 670l7 7 14-17" fill="none" stroke="#c5800c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="62" y="726" class="card-title">근거를 교차 검증</text>
  <text x="62" y="756" class="body">버전 문자열만 믿지 않습니다.</text>

  <text x="62" y="796" class="lbl">벤더 근거 — 백포트 판별</text>
  <rect x="62" y="806" width="388" height="36" rx="12" fill="#fff8e9"/>
  <text x="256" y="830" text-anchor="middle" class="chip">OSV 영향 범위 · changelog 대조</text>
  <rect x="62" y="850" width="388" height="36" rx="12" fill="#fff8e9"/>
  <text x="256" y="874" text-anchor="middle" class="chip">errata · 벤더 OVAL · 미수정 목록</text>

  <text x="62" y="916" class="lbl">함께 대조하는 축 — ISMS-P · N2SF</text>
  <rect x="62" y="926" width="388" height="36" rx="12" fill="#f3f6fc"/>
  <text x="256" y="950" text-anchor="middle" class="chip">SBOM 8개 생태계 · U-코드 72 · CCE 39종</text>

  <text x="62" y="992" class="foot">백포트 오탐 억제 · 판정 근거 보존</text>

  <path d="M484 825H514" stroke="#7180a7" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 4 : 조치 -->
  <g filter="url(#shadow)"><rect x="524" y="630" width="440" height="390" rx="24" fill="#fff" stroke="#dce5f7"/></g>
  <rect x="550" y="654" width="88" height="32" rx="16" fill="#f6ecff"/>
  <text x="594" y="676" text-anchor="middle" class="step" fill="#7b45bd">04 조치</text>
  <circle cx="922" cy="670" r="24" fill="#f7efff"/>
  <path d="M911 670h22M922 659v22" stroke="#8751c5" stroke-width="3.5" stroke-linecap="round"/>
  <text x="550" y="726" class="card-title">우선순위와 조치</text>
  <text x="550" y="756" class="body">무엇부터 할지 보여줍니다.</text>

  <text x="550" y="796" class="lbl">무엇이 먼저인가</text>
  <rect x="550" y="806" width="388" height="36" rx="12" fill="#f8f1ff"/>
  <text x="744" y="830" text-anchor="middle" class="chip" fill="#7240ad">KEV · EPSS · 실행 위험 · 노출도</text>
  <rect x="550" y="850" width="388" height="36" rx="12" fill="#f8f1ff"/>
  <text x="744" y="874" text-anchor="middle" class="chip" fill="#7240ad">U-코드 커버리지의 빈칸</text>

  <text x="550" y="916" class="lbl">무엇을 하면 되는가</text>
  <rect x="550" y="926" width="388" height="36" rx="12" fill="#f8f1ff"/>
  <text x="744" y="950" text-anchor="middle" class="chip" fill="#7240ad">업데이트 · 재시작 · 이미지 재빌드</text>

  <text x="550" y="992" class="foot">위험 · 억제 · 판정 불가 구분 · 에이전트 자동 업데이트</text>
</svg>
