# =============================================================================
# vuln-agent · Compose Dev (개발 환경)
# =============================================================================
# 특징:
#   - 소스 라이브 마운트(./server) → PHP 수정 즉시 반영, 재빌드 불필요
#   - DB 포트도 호스트에 노출 → 개발 중 DB 직접 접속/디버깅 가능
#   - 웹 포트 노출 → http://localhost:${WEB_PORT}
# 실행:  ./compose_runner.sh dev up -d
#
# 컨테이너명은 변수로 둔다 — wt/ 워크트리에서 띄우면 compose_runner.sh 가
# 워크트리 이름을 접미사로 붙여 메인 dev 스택과 이름이 겹치지 않게 한다.
# =============================================================================

services:
  db:
    container_name: ${DB_CONTAINER:-vulnagent-db-dev}
    ports:
      - "${DB_PORT:-3307}:3306"

  web:
    container_name: ${WEB_CONTAINER:-vulnagent-web-dev}
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      # 소스를 그대로 마운트 (docroot 는 이미지의 /var/www/html/public)
      - ../server:/var/www/html
      # 에이전트 스크립트를 웹에서 내려받게 한다(agent-dl.php). docroot 밖이라 직접 노출은 안 됨.
      - ../agent:/var/www/agent-src:ro
      # 배포별 Caddy 루트 CA(공개, gitignore). agent-dl.php 가 배포자 CA 를 내보낸다. dev 는 HTTP 라 보통 비어 있음.
      - ../agent-ca:/var/www/agent-ca:ro

  scheduler:
    container_name: ${SCHEDULER_CONTAINER:-vulnagent-scheduler-dev}
    volumes:
      - ../server:/var/www/html   # 소스 라이브 반영
