# =============================================================================
# vuln-agent · Compose Base (서비스 정의)
# =============================================================================
# compose.common.yml + compose.{dev,prod}.yml 과 겹쳐서 사용.
#   실행:  ./compose_runner.sh dev up -d   /   ./compose_runner.sh prod up -d
#
# [비밀값] 비밀번호·토큰은 Docker Secrets(txt) 로 주입 (secrets/*.txt, gitignore).
# [서비스] db(MySQL) · web(PHP/Apache) · scheduler(피드 수집 주기 실행)
# =============================================================================

# 앱 컨테이너(web·scheduler) 공통 환경/시크릿 — 앵커로 재사용
x-app-env: &app-env
  # 기본은 서비스명 "db"(같은 프로젝트 안에서 뜨는 prod·메인트리 dev). 워크트리 dev 는 db 를
  # 이 프로젝트에서 안 띄우므로(공용 db 는 메인 트리 프로젝트 소유) compose_runner.sh 가
  # DB_HOST=vulnagent-db-dev 로 덮어써 공용 db 컨테이너명을 직접 가리키게 한다.
  DB_HOST: ${DB_HOST:-db}
  DB_NAME: ${MYSQL_DATABASE}
  DB_USER: ${MYSQL_USER}
  DB_PASS_FILE: /run/secrets/mysql_password
  INGEST_TOKEN_FILE: /run/secrets/ingest_token
  ADMIN_PASSWORD_FILE: /run/secrets/admin_password
  TZ: Asia/Seoul
  # 로그인 실패 제한/계정 잠금 — 시크릿 아닌 일반 설정값(vg_env, auth.php 가 기본값도 갖고 있음).
  LOGIN_MAX_FAILS: ${LOGIN_MAX_FAILS:-5}
  LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}

x-app-secrets: &app-secrets
  # 주의: Apache 는 www-data(uid33)로 돌고, non-swarm compose 는 시크릿을 호스트 권한
  # 그대로 마운트한다. 따라서 www-data 가 읽으려면 secrets/*.txt 가 0644 여야 한다
  # (compose_runner.sh init 이 0644 로 생성). compose 의 mode 지정은 swarm 전용이라 무시됨.
  - mysql_password
  - ingest_token
  - admin_password

services:
  # --- MySQL: 수집 데이터 저장소 -------------------------------------------
  db:
    image: mysql:${MYSQL_VERSION:-8.0}
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      TZ: Asia/Seoul
    secrets:
      - mysql_root_password
      - mysql_password
    volumes:
      # DB_DATA 미설정=named volume(db_data, dev/Windows). 절대경로면 서버 바인드마운트(prod).
      #   운영은 .env.prod 에 DB_DATA=/data/vulnagent/mysql 로 서버 디스크에 영속(down -v 에도 안전).
      - ${DB_DATA:-db_data}:/var/lib/mysql
      - ../db:/docker-entrypoint-initdb.d:ro
      # my.cnf 는 운영 전용(compose.prod.yml) — Windows dev 는 기본값 사용
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$(cat /run/secrets/mysql_root_password)\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - vulnagent

  # --- PHP(Apache): 수신 API + 대시보드 ------------------------------------
  web:
    build: ../server
    image: vulnagent-app:${APP_TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env
    secrets: *app-secrets
    # Apache 프로세스는 살아있어도(running) PHP 요청 처리가 멈춘 상태(외부 API 호출에서
    # 멈춤·DB 락 대기 등)일 수 있다 — pre-push/smoke.sh 가 "떠 있음"과 "응답 가능"을 구분해
    # 판정하도록 healthcheck 를 둔다. 베이스 이미지(php:8.3-apache)엔 curl/wget 이 없어
    # PHP 내장 http 래퍼로 대신한다.
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://localhost/') !== false ? 0 : 1);\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - vulnagent

  # --- 스케줄러: 예약된 피드 커넥터를 주기 실행(사이드카) -------------------
  # HTTP 서버가 아니라 while 루프라 HTTP healthcheck 를 붙일 대상이 없다. 컨테이너가
  # running 이면 곧 다음 루프 턴이 돈다는 뜻이라 running=응답가능이 거의 그대로 성립하고,
  # 억지로 헬스체크용 마커 파일 등을 새로 만드는 건 지금 요구가 없다(YAGNI) — 생략한다.
  scheduler:
    build: ../server
    image: vulnagent-app:${APP_TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env
    secrets: *app-secrets
    command: ["sh", "-c", "while true; do php /var/www/html/bin/scheduler.php || true; sleep 60; done"]
    networks:
      - vulnagent


# --- Docker Secrets: 비밀값을 txt 파일에서 로드 -----------------------------
secrets:
  mysql_root_password:
    file: ../secrets/mysql_root_password.txt
  mysql_password:
    file: ../secrets/mysql_password.txt
  ingest_token:
    file: ../secrets/ingest_token.txt
  admin_password:
    file: ../secrets/admin_password.txt

networks:
  vulnagent:

volumes:
  db_data:
