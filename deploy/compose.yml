# =============================================================================
# vuln-agent · Compose Base (서비스 정의)
# =============================================================================
# compose.common.yml + compose.{dev,prod}.yml 과 겹쳐서 사용.
#   실행:  ./compose_runner.sh dev up -d   /   ./compose_runner.sh prod up -d
#
# [비밀값] 비밀번호·토큰은 Docker Secrets(txt) 로 주입 (secrets/*.txt, gitignore).
# [서비스] db(MySQL) · web(PHP/Apache) · scheduler(피드 수집 주기 실행)
# =============================================================================

# 앱 컨테이너(web·scheduler) 공통 환경/시크릿 — 앵커로 재사용
x-app-env: &app-env
  # 기본은 서비스명 "db"(같은 프로젝트 안에서 뜨는 prod·메인트리 dev). 워크트리 dev 는 db 를
  # 이 프로젝트에서 안 띄우므로(공용 db 는 메인 트리 프로젝트 소유) compose_runner.sh 가
  # DB_HOST=vulnagent-db-dev 로 덮어써 공용 db 컨테이너명을 직접 가리키게 한다.
  DB_HOST: ${DB_HOST:-db}
  DB_NAME: ${MYSQL_DATABASE}
  DB_USER: ${MYSQL_USER}
  DB_PASS_FILE: /run/secrets/mysql_password
  INGEST_TOKEN_FILE: /run/secrets/ingest_token
  ADMIN_PASSWORD_FILE: /run/secrets/admin_password
  # translate(LibreTranslate)는 db 와 달리 워크트리마다 독립된 인스턴스다(compose.dev.yml 참고,
  # 이유는 그 파일 헤더에). 기본은 서비스명("translate", prod 처럼 프로젝트가 하나뿐인 환경에서
  # 유효)이고, dev 는 트리마다 컨테이너명이 다르므로 compose_runner.sh 가 항상
  # TRANSLATE_HOST=http://<이 트리의 translate 컨테이너명>:5000 로 덮어쓴다.
  TRANSLATE_HOST: ${TRANSLATE_HOST:-http://translate:5000}
  TZ: Asia/Seoul

x-app-secrets: &app-secrets
  # 주의: Apache 는 www-data(uid33)로 돌고, non-swarm compose 는 시크릿을 호스트 권한
  # 그대로 마운트한다. 따라서 www-data 가 읽으려면 secrets/*.txt 가 0644 여야 한다
  # (compose_runner.sh init 이 0644 로 생성). compose 의 mode 지정은 swarm 전용이라 무시됨.
  - mysql_password
  - ingest_token
  - admin_password

services:
  # --- MySQL: 수집 데이터 저장소 -------------------------------------------
  db:
    image: mysql:${MYSQL_VERSION:-8.0}
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      TZ: Asia/Seoul
    secrets:
      - mysql_root_password
      - mysql_password
    volumes:
      # DB_DATA 미설정=named volume(db_data, dev/Windows). 절대경로면 서버 바인드마운트(prod).
      #   운영은 .env.prod 에 DB_DATA=/data/vulnagent/mysql 로 서버 디스크에 영속(down -v 에도 안전).
      - ${DB_DATA:-db_data}:/var/lib/mysql
      - ../db:/docker-entrypoint-initdb.d:ro
      # my.cnf 는 운영 전용(compose.prod.yml) — Windows dev 는 기본값 사용
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$(cat /run/secrets/mysql_root_password)\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - vulnagent

  # --- PHP(Apache): 수신 API + 대시보드 ------------------------------------
  web:
    build: ../server
    image: vulnagent-app:${APP_TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env
    secrets: *app-secrets
    networks:
      - vulnagent

  # --- 스케줄러: 예약된 피드 커넥터를 주기 실행(사이드카) -------------------
  scheduler:
    build: ../server
    image: vulnagent-app:${APP_TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env
    secrets: *app-secrets
    command: ["sh", "-c", "while true; do php /var/www/html/bin/scheduler.php || true; sleep 60; done"]
    networks:
      - vulnagent

  # --- LibreTranslate: CVE/KEV 요약 영→한 기계번역 (자체 호스팅, 외부 포트 미노출) ---
  #   db 와 달리 워크트리마다 독립 인스턴스로 띄운다(compose.dev.yml 헤더에 이유 상세).
  #   web/scheduler 는 이 서비스가 없어도 죽지 않는다 — 번역은 부가 기능이라 일부러
  #   depends_on 을 걸지 않는다(vg_translate_ko() 가 타임아웃/에러를 흡수해 null 을 돌려줄 뿐
  #   CVE 수집·매칭 파이프라인을 막지 않는다).
  translate:
    image: libretranslate/libretranslate:latest
    environment:
      # 영어→한글만 쓰므로 로드 언어를 제한해 기동 시간·메모리를 줄인다(공식 문서·소스 확인:
      # libretranslate/default_values.py 의 LOAD_ONLY → env LT_LOAD_ONLY).
      LT_LOAD_ONLY: en,ko
    healthcheck:
      # 공식 docker-compose.yml 과 동일한 헬스체크(scripts/healthcheck.py) — 모델 로드 중엔
      # /tmp/booting.flag 를 보고 즉시 성공 처리를 건너뛴다. 첫 기동은 모델 다운로드까지
      # 포함해 수 분 걸릴 수 있어 start_period·retries 를 넉넉히 둔다.
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s
    networks:
      - vulnagent

# --- Docker Secrets: 비밀값을 txt 파일에서 로드 -----------------------------
secrets:
  mysql_root_password:
    file: ../secrets/mysql_root_password.txt
  mysql_password:
    file: ../secrets/mysql_password.txt
  ingest_token:
    file: ../secrets/ingest_token.txt
  admin_password:
    file: ../secrets/admin_password.txt

networks:
  vulnagent:

volumes:
  db_data:
