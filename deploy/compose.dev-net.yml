# =============================================================================
# vuln-agent · Compose Dev — 공유 네트워크
# =============================================================================
# db(메인 트리 전용 프로젝트)와 web/scheduler(워크트리별 독립 프로젝트)는 서로 다른
# docker compose 프로젝트로 뜨기 때문에, 기본값인 프로젝트별 네트워크로는 서로를 찾을 수
# 없다. 그래서 dev 환경 전체(메인 트리·모든 워크트리)가 외부(external) 네트워크 하나를
# 공유하도록 compose.yml 의 `vulnagent` 네트워크 정의를 덮어쓴다. 네트워크 자체는
# compose_runner.sh 가 dev 실행 전에 없으면 만든다(docker network create) — 이 파일은
# 존재를 전제로 "이 네트워크를 쓴다"고만 선언한다.
#
# prod 는 이 파일을 쓰지 않는다(프로젝트가 하나뿐이라 기본 네트워크로 충분).
# =============================================================================

networks:
  vulnagent:
    external: true
    name: vulnagent-dev-net
