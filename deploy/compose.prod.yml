# =============================================================================
# vuln-agent · Compose Prod (운영 환경 · 리눅스 서버)
# =============================================================================
# 특징:
#   - 소스를 읽기전용으로 마운트 → PHP 만 바뀌면 git pull 로 끝(재빌드·다운타임 없음).
#     Dockerfile·compose·caddy 가 바뀔 때만 재빌드. 판단은 deploy/update.sh 가 한다.
#   - DB 포트 미노출 → 컨테이너 내부 네트워크(vulnagent)로만 접근. 공격면 축소.
#   - 앞단 Caddy 리버스 프록시가 TLS(HTTPS) 종료 → web 은 내부(80)로만.
#     외부 8080 포워딩을 재사용(https://ost-server.duckdns.org:8080), 새 포트 개방 불필요.
# 실행:  ./compose_runner.sh prod up -d --build
# =============================================================================

services:
  db:
    container_name: vulnagent-db
    # DB 포트 노출 → 점프호스트(firewall)가 master:3306 에 닿아 HeidiSQL SSH 터널로 접속 가능.
    # master 는 공인 IP 가 없고(사내망 10.3.142.200 + loopback 뿐) 네트워크 방화벽이 외부 3306 을
    # 차단하므로, 0.0.0.0 이어도 실제 노출은 사내망까지. 접속은 vulnagent 비번 인증 필요.
    ports:
      - "3306:3306"
    volumes:
      # my.cnf 튜닝/보안 설정은 운영에서만 적용 (리눅스 → 권한 정상)
      - ./config/mysql/my.cnf:/etc/mysql/conf.d/zz-vulnagent.cnf:ro

  web:
    container_name: vulnagent-web
    # 외부는 앞단 caddy(HTTPS)만 통과 → web 은 네트워크에 노출 안 함.
    # 단, 같은 호스트의 로컬 에이전트가 평문으로 ingest 하도록 loopback 전용 포트만 노출.
    #   127.0.0.1 바인딩이라 외부/네트워크에서는 접근 불가(서버 자신에서만).
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      # 소스를 읽기전용으로 마운트 → PHP 만 바뀐 배포는 git pull 로 끝난다(재빌드·다운타임 없음).
      #   opcache.validate_timestamps=1, revalidate_freq=2 라 덮어쓰면 2초 안에 새 코드가 로드된다.
      #   ro: 코드가 자기 디렉토리에 쓰는 일이 없고(확인됨), 웹셸이 코드를 덮어쓰는 것도 막는다.
      #   이미지의 COPY 는 그대로 둔다 — 마운트 없이 띄워도 동작하는 안전망.
      - ../server:/var/www/html:ro

  scheduler:
    container_name: vulnagent-scheduler
    volumes:
      # web 과 같은 이유. scheduler 는 매 분 php 를 새로 띄우므로 다음 주기부터 새 코드를 쓴다.
      - ../server:/var/www/html:ro

  # --- Caddy: HTTPS 종료 리버스 프록시 -------------------------------------
  #   Let's Encrypt 인증서를 DuckDNS DNS-01 로 발급(인바운드 80/443 불필요).
  #   호스트 ${WEB_PORT}(기존 8080 포워딩) → 컨테이너 443(TLS) → 내부 web:80.
  caddy:
    container_name: vulnagent-caddy
    build: ./caddy
    image: vulnagent-caddy:latest
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${WEB_PORT:-8080}:443"
    environment:
      TZ: Asia/Seoul
    secrets:
      - duckdns_token
    volumes:
      - caddy_data:/data      # 발급 인증서 영속화(재시작해도 재발급 안 함)
      - caddy_config:/config
    networks:
      - vulnagent

secrets:
  duckdns_token:
    file: ../secrets/duckdns_token.txt

volumes:
  caddy_data:
  caddy_config:
