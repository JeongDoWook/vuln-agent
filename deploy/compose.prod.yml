# =============================================================================
# vuln-agent · Compose Prod (운영 환경 · 리눅스 서버)
# =============================================================================
# 특징:
#   - 소스를 읽기전용으로 마운트 → PHP 만 바뀌면 git pull 로 끝(재빌드·다운타임 없음).
#     Dockerfile·compose·caddy 가 바뀔 때만 재빌드. 판단은 deploy/update.sh 가 한다.
#   - DB 포트 미노출 → 컨테이너 내부 네트워크(vulnagent)로만 접근. 공격면 축소.
#   - 앞단 Caddy 리버스 프록시가 TLS(HTTPS) 종료 → web 은 내부(80)로만.
#     정식 주소는 포트 없는 https://<운영-도메인> (443). 평문 80 으로 들어오면
#     Caddy 가 https 로 308 리다이렉트한다. 기존 8080 포워딩도 하위호환으로 계속 살려 둔다
#     (설치된 에이전트들이 :8080 으로 등록돼 있다 — caddy ports 주석 참고).
# 실행:  ./compose_runner.sh prod up -d --build
# =============================================================================

services:
  db:
    container_name: vulnagent-db
    # 운영만 4g 로 올린다(공통값은 compose.common.yml 의 3g — dev 는 그대로 3g 를 쓴다).
    #
    # 이 값은 config/mysql/my.cnf 의 innodb_buffer_pool_size 와 **짝**이다.
    #   버퍼풀은 미리 선점되는 고정 메모리라, mem_limit 에서 버퍼풀을 뺀 나머지로
    #   커넥션별 버퍼(max_connections=150)·임시테이블·InnoDB 로그버퍼·스레드 오버헤드를 다 감당한다.
    #   한쪽만 올리면 여유가 사라진다 → 접속이 몰릴 때 cgroup 이 mysqld 를 SIGKILL 하고,
    #   그건 즉시 DB 중단이다(잡히는 오류가 아니다 — scheduler 에서 겪은 것과 같은 종류다).
    #
    # 왜 지금 올리나(실측 2026-07-26): my.cnf 가 2026-07-22 에 버퍼풀을 256M→2048M 로 올렸는데
    #   mem_limit 은 3g 그대로였다. 그 결과 운영 db 가 2.815GiB/3GiB = **94%** 로 정착했고
    #   남은 여유가 ~200MB 뿐이다. 4g 면 버퍼풀 2g 외에 ~2g 가 남아 접속 스파이크를 흡수한다.
    #   (그 시점까지 OOMKilled=false 로 안정이었다 — 장애 대응이 아니라 여유 확보다.)
    #
    # dev 를 안 올리는 이유: dev 는 my.cnf 를 마운트하지 않아(Windows 권한) 버퍼풀이 기본값이고,
    #   실측 551MiB/3GiB = 18% 라 여유가 크다. 로컬에 4g 를 잡아 두면 순수 낭비다.
    #
    # **적용에는 컨테이너 재생성이 필요하다**(`--force-recreate`). mem_limit 은 실행 중 컨테이너에
    #   반영되지 않는다 — git pull 만으로는 3g 가 그대로 남는다(#339 에서 같은 함정을 겪었다).
    #   적용 확인: docker inspect vulnagent-db --format '{{.HostConfig.Memory}}' → 4294967296
    mem_limit: 4g
    # DB 포트 노출 → 점프호스트가 DB 호스트의 3306 에 닿아 HeidiSQL SSH 터널로 접속 가능.
    # master 는 공인 IP 가 없고(사내망 사설 IP + loopback 뿐) 네트워크 방화벽이 외부 3306 을
    # 차단하므로, 0.0.0.0 이어도 실제 노출은 사내망까지. 접속은 vulnagent 비번 인증 필요.
    ports:
      - "3306:3306"
    volumes:
      # my.cnf 튜닝/보안 설정은 운영에서만 적용 (리눅스 → 권한 정상)
      - ./config/mysql/my.cnf:/etc/mysql/conf.d/zz-vulnagent.cnf:ro

  web:
    container_name: vulnagent-web
    # 외부는 앞단 caddy(HTTPS)만 통과 → web 은 네트워크에 노출 안 함.
    # 단, 같은 호스트의 로컬 에이전트가 평문으로 ingest 하도록 loopback 전용 포트만 노출.
    #   127.0.0.1 바인딩이라 외부/네트워크에서는 접근 불가(서버 자신에서만).
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      # 소스를 읽기전용으로 마운트 → PHP 만 바뀐 배포는 git pull 로 끝난다(재빌드·다운타임 없음).
      #   opcache.validate_timestamps=1, revalidate_freq=2 라 덮어쓰면 2초 안에 새 코드가 로드된다.
      #   ro: 코드가 자기 디렉토리에 쓰는 일이 없고(확인됨), 웹셸이 코드를 덮어쓰는 것도 막는다.
      #   이미지의 COPY 는 그대로 둔다 — 마운트 없이 띄워도 동작하는 안전망.
      - ../server:/var/www/html:ro
      # 에이전트 스크립트를 웹에서 내려받게 한다(agent-dl.php). docroot 밖이라 직접 노출은 안 됨.
      - ../agent:/var/www/agent-src:ro
      # 배포별 Caddy 루트 CA(공개, gitignore). 최초 배포 시 관리자가 추출해 둔다(deploy/README.md).
      - ../agent-ca:/var/www/agent-ca:ro

  scheduler:
    container_name: vulnagent-scheduler
    volumes:
      # web 과 같은 이유. scheduler 는 매 분 php 를 새로 띄우므로 다음 주기부터 새 코드를 쓴다.
      - ../server:/var/www/html:ro

  # --- Caddy: HTTPS 종료 리버스 프록시 -------------------------------------
  #   인증서는 Caddy 내부 CA 자체서명이라 인바운드 80 은 발급에 쓰이지 않는다.
  #   호스트 80/443/${WEB_PORT} → 컨테이너 80(리다이렉트)·443(TLS) → 내부 web:80.
  caddy:
    container_name: vulnagent-caddy
    build: ./caddy
    image: vulnagent-caddy:latest
    restart: unless-stopped
    # 나머지 서비스와 동일하게 로그 로테이션 — 무제한 누적 방지
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - web
    # 세 줄이 각각 다른 이유로 존재한다 — 하나라도 지우면 무엇이 깨지는지 아래에 남긴다.
    ports:
      # ① 8080 → 443 : **기존 에이전트 하위호환. 절대 지우지 말 것.**
      #    설치된 에이전트들이 https://<운영-도메인>:8080/ingest.php 로 등록돼 있고,
      #    agent/install-agent.sh·agent/README.md·server/public/assets.php 의 설치 안내도
      #    전부 이 포트를 쓴다(도메인 부분만 저장소에서 플레이스홀더/예시로 바꿨다).
      #    지우는 순간 재설치 전까지 수집이 통째로 끊긴다.
      - "${WEB_PORT:-8080}:443"
      # ② 80 → 80 : 평문 진입점. Caddyfile 사이트 블록에 포트를 안 적었으므로 Caddy 가 80
      #    리다이렉트 리스너를 자동으로 만들어 둔 상태다(컨테이너 안에서 이미 listen 중).
      #    이 줄이 없으면 사용자가 http:// 로 들어올 때 TLS 포트에 평문이 꽂혀
      #    "Client sent an HTTP request to an HTTPS server." 400 이 뜬다(Caddy 하드코딩 문구라
      #    Caddyfile 로 못 바꾼다). 열어 두면 대신 https 로 308 리다이렉트가 나간다.
      - "80:80"
      # ③ 443 → 443 : ②가 보내는 **목적지**. 리다이렉트 Location 이 포트 없는
      #    https://<운영-도메인>/… 라 443 이 안 열려 있으면 리다이렉트만 되고
      #    정작 접속이 안 된다. ②와 짝으로만 의미가 있다.
      - "443:443"
    environment:
      TZ: Asia/Seoul
      # Caddyfile 의 사이트 주소({$PROD_DOMAIN}). .env.prod 에서 온다.
      #   `:?` 를 붙여 **값이 없으면 compose 가 명확한 메시지로 거부**하게 한다 — 조용히 뜨면
      #   Caddy 가 빈 주소로 파싱해 "unrecognized global option: encode" 로 죽는데, 그 메시지만
      #   보고 원인이 .env.prod 라는 걸 알아채기 어렵다. 여기서 먼저 걸리는 편이 낫다.
      PROD_DOMAIN: ${PROD_DOMAIN:?deploy/.env.prod 에 PROD_DOMAIN=운영도메인 을 추가하세요 (Caddy TLS 사이트 주소)}
    volumes:
      - caddy_data:/data      # 내부 CA·발급 인증서 영속화(재시작해도 재발급 안 함)
      - caddy_config:/config
    networks:
      - vulnagent

volumes:
  caddy_data:
  caddy_config:
