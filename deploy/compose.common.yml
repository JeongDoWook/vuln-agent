# =============================================================================
# vuln-agent · Compose Common (공통 런타임)
# =============================================================================
# dev/prod 모두에 적용되는 운영 설정: 재시작 정책, 로그 로테이션, 프로세스 제한.
# 서비스 "정의"는 compose.yml, 환경별 차이는 compose.{dev,prod}.yml.
# =============================================================================

services:
  db:
    restart: unless-stopped
    pids_limit: 512
    mem_limit: 1g
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    restart: unless-stopped
    pids_limit: 256
    mem_limit: 768m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    restart: unless-stopped
    pids_limit: 128
    mem_limit: 384m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  translate:
    restart: unless-stopped
    pids_limit: 128
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
