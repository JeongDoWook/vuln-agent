# =============================================================================
# vuln-agent · Compose Common (공통 런타임)
# =============================================================================
# dev/prod 모두에 적용되는 운영 설정: 재시작 정책, 로그 로테이션, 프로세스 제한.
# 서비스 "정의"는 compose.yml, 환경별 차이는 compose.{dev,prod}.yml.
# =============================================================================

services:
  db:
    restart: unless-stopped
    pids_limit: 512
    mem_limit: 1g
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    restart: unless-stopped
    pids_limit: 256
    mem_limit: 768m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    restart: unless-stopped
    pids_limit: 128
    mem_limit: 384m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  translate:
    restart: unless-stopped
    # LT_THREADS=8 + torch/ctranslate2 기본 스레드풀만으로 idle 상태에서 이미 PIDS 115/128 —
    # 동시요청 자체는 스레드 수를 늘리지 않는다고 실측했지만(요청은 이미 떠 있는 워커 스레드
    # 큐에 쌓일 뿐) 여유가 13개뿐이라 GC·헬스체크 등 일시 스레드에도 위험하다. 여유를 두려고
    # 다른 워크트리를 건드리지 않는 배수(웹과 같은 256)로 올린다.
    pids_limit: 256
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
