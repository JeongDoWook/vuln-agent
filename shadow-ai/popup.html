<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>섀도우 AI DLP</title>
<style>
  body {
    width: 340px;
    margin: 0;
    background: #0d1017;
    color: #c9d1d9;
    font-family: "Malgun Gothic", -apple-system, sans-serif;
  }
  header { padding: 12px 14px; border-bottom: 1px solid #21262d; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  .vg-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .vg-mode { display: flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; }
  .vg-total { font-size: 12px; color: #8b949e; white-space: nowrap; }
  #clear-btn {
    background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
    border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer;
  }
  #clear-btn:hover { background: #30363d; }
  .vg-list { max-height: 360px; overflow-y: auto; padding: 8px 14px; }
  .vg-item {
    background: #161b22; border: 1px solid #21262d; border-radius: 6px;
    padding: 8px 10px; margin-bottom: 8px;
  }
  .vg-item-head { display: flex; justify-content: space-between; font-size: 11px; color: #8b949e; margin-bottom: 6px; }
  .vg-badges { margin-bottom: 6px; }
  .vg-badge {
    display: inline-block; background: #3a0d10; color: #ff8080; border: 1px solid #e5484d;
    border-radius: 10px; padding: 1px 8px; font-size: 11px; margin-right: 4px; margin-bottom: 4px;
  }
  .vg-snippet { font-size: 12px; color: #c9d1d9; font-family: monospace; word-break: break-all; }
  .vg-empty { text-align: center; color: #8b949e; font-size: 12px; padding: 24px 0; }
  footer { padding: 8px 14px; border-top: 1px solid #21262d; font-size: 11px; }
  footer a { color: #58a6ff; cursor: pointer; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <header>
    <h1>섀도우 AI DLP</h1>
    <div class="vg-toolbar">
      <label class="vg-mode">
        <input type="checkbox" id="mode-toggle" />
        <span id="mode-label">감시(monitor)</span>
      </label>
      <span class="vg-total">총 위반 <b id="total-count">0</b>건</span>
      <button id="clear-btn">로그 비우기</button>
    </div>
  </header>
  <div class="vg-list" id="violation-list"></div>
  <footer><a id="options-link" href="#">상세 설정 열기</a></footer>
  <script src="detectors.js"></script>
  <script src="popup.js"></script>
</body>
</html>
