# vuln-agent 중앙 서버 — PHP(Apache) + MySQL 8
# 사용:  cp .env.example .env  → 값 수정 →  docker compose up -d --build
services:
  db:
    image: mysql:8.0
    container_name: vulnagent-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      # 컨테이너 최초 기동 시 db/*.sql 자동 적용
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build: ./server
    container_name: vulnagent-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
      INGEST_TOKEN: ${INGEST_TOKEN}
      TZ: Asia/Seoul
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      # 개발 편의: 소스 변경 즉시 반영 (docroot 는 이미지의 /var/www/html/public)
      - ./server:/var/www/html

volumes:
  db_data:
