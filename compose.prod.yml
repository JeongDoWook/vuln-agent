# =============================================================================
# vuln-agent · Compose Prod (운영 환경 · 리눅스 서버)
# =============================================================================
# 특징:
#   - 소스 마운트 없음 → 이미지에 구워진(COPY) 코드로 동작. 배포 = 재빌드.
#   - DB 포트 미노출 → 컨테이너 내부 네트워크(vulnagent)로만 접근. 공격면 축소.
#   - 웹 포트만 노출. 실제 서비스는 앞단 리버스 프록시(nginx 등) 뒤에 두는 걸 권장.
# 실행:  ./compose_runner.sh prod up -d --build
# =============================================================================

services:
  db:
    container_name: vulnagent-db
    # 운영: DB 포트를 호스트로 노출하지 않는다 (ports 정의 없음).

  web:
    container_name: vulnagent-web
    ports:
      - "${WEB_PORT:-8080}:80"
    # 운영: 소스 마운트 없음 (volumes 정의 없음) → 이미지 코드 사용.
